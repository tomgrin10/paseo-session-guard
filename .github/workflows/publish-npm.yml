name: Publish to npm

# The steps live in paseo-plugin-kit's reusable workflow. npm's trusted publisher still names this
# file (publish-npm.yml), since npm checks the calling workflow. Bump the tag together with the
# paseo-plugin-kit devDependency.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  publish:
    uses: tomgrin10/paseo-plugin-kit/.github/workflows/publish-npm.yml@v0.2.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      # scripts/check-package-install.mjs drives a Paseo daemon during verify.
      paseo-cli: 0.14.0
